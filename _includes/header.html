<header class="site-header no-print">
  <div class="container header-bar">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      {%- for item in site.nav -%}
        <a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
      {%- endfor -%}
      {%- if site.cv_url -%}
        <a class="cv-button" href="{{ site.cv_url | relative_url }}" target="_blank" rel="noopener">
          <i class="fas fa-file-pdf" aria-hidden="true"></i> CV
        </a>
      {%- endif -%}
    </nav>
  </div>
</header>
