<section class="container intro" id="about" aria-labelledby="about-name">
  <div class="intro-text">
    <p class="eyebrow">{{ site.title | escape }}</p>
    <h1 id="about-name">{{ site.name | escape }}</h1>
    {%- if site.tagline -%}<p class="intro-tagline">{{ site.tagline | escape }}</p>{%- endif -%}

    <div class="intro-copy">
      {{ site.about_content | strip | markdownify }}
    </div>

    <div class="intro-links no-print">
      {%- for link in site.intro_links -%}
        <a href="{{ link.url | relative_url }}"{% unless link.url contains 'mailto:' or link.url contains '/files/' %} target="_blank" rel="noopener"{% endunless %}>
          <i class="{{ link.icon }}" aria-hidden="true"></i><span>{{ link.title | escape }}</span>
        </a>
      {%- endfor -%}
    </div>
  </div>

  {%- if site.about_profile_image -%}
    <img class="intro-portrait" src="{{ site.about_profile_image | relative_url }}" alt="{{ site.name | escape }}">
  {%- endif -%}
</section>
