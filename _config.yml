about_content: | # this will include new lines to allow paragraphs
  Hello! I'm Thao, a Ph.D. candidate in the Department of Computer Science at the University of Illinois at Urbana-Champaign (UIUC). I am fortunate to be advised by Prof. [Heng Ji](https://blender.cs.illinois.edu/hengji.html).

  I am currently working with the Molecule Maker Lab Institute ([MMLI](https://moleculemaker.org/)) and the Center for Advanced Bioenergy and Bioproducts Innovation ([CABBI](https://cabbi.bio/)), where I build LLM-powered agents and foundation models for molecular representation, property prediction, and generation/optimization for drug design and materials science. I've interned at Prescient Design, Genentech / Roche (Summer 2026), and am currently interning at Apodex.

content:
  - title: Research interests # Title for the section
    layout: text
    content: |
      My research interests center on combining large language models (LLMs) with graph neural networks (GNNs) to build <mark>agentic AI systems for scientific discovery</mark>, with a focus on drug and materials design. Specifically, I am drawn to the following areas:
      - LLM-powered agents for autonomous molecular design and optimization
      - Molecule-native representations and modular chemical language models
      - Synthesizable and fragment-based molecule generation
      - Structure-guided optimization for binding specificity and protein design
      - Foundation models for molecular and protein representation
      - High-fidelity, interpretable molecular property prediction (e.g., solubility, functional groups)

